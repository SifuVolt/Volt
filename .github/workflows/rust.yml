name: Rust checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Rust tests
        run: cargo generate-lockfile && cat Cargo.lock && cargo test --locked
      - name: Validate telemetry visualizer syntax
        run: python3 -m py_compile training/visualizer/plot_volt_trace.py
      - name: Build RLBot release binary
        run: cargo build --release --locked
